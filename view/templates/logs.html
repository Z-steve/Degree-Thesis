<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Logs - SDS</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <script src="/static/js/jquery.js" defer></script>
    <script src="/static/js/script.js" defer></script>
    <link rel="icon" href="/static/images/icon.svg">
</head>
<body>
    <nav class="sidebar">
        <div class="brand">
            <img src="/static/images/icon.svg" alt="SDS Logo">
            <h2>SDS ADMIN</h2>
        </div>
        <ul class="nav-links">
            <li><a href="/">Dashboard</a></li>
            <li><a href="/dns_table">DNS Expiration</a></li>
            <li><a href="/logs" class="active">System Logs</a></li>
            <li><a href="/about">About</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="page-header">
            <h1>System Logs</h1>
        </div>
        
        <div class="dashboard-grid">
            <div class="card" style="grid-column: 1 / -1;">
                <h3>Event & Alert Logs</h3>
                <p>Real-time stream of system events, detection alerts, and blocked connection attempts.</p>
                <div class="table-container">
                    <table id="logs-table">
                        <thead>
                            <tr>
                                <th style="width: 200px;">Timestamp</th>
                                <th>Message</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
