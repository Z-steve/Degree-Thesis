<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDS Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Scan Detection System Dashboard</h1>
        <h2>DNS Expiration Table</h2>
        <table id="dns-table">
            <thead>
                <tr>
                    <th>Key</th>
                    <th>Expiration Time</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <h2>Blocked IPs</h2>
        <table id="blocked-ips">
            <thead>
                <tr>
                    <th>IP</th>
                    <th>Expiration Time</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <h2>Allowlisted Users</h2>
        <ul id="allowlisted-users"></ul>

        <h2>Performance Metrics</h2>
        <div id="metrics">
            <p>Packet Count: <span id="packet-count">0</span></p>
            <p>Average Latency: <span id="avg-latency">0</span>s</p>
            <p>Average CPU Usage: <span id="avg-cpu">0</span>%</p>
            <p>Average Memory Usage: <span id="avg-memory">0</span>%</p>
        </div>

        <h2>Execute Command</h2>
        <input type="text" id="command-input" placeholder="e.g., block_ip 192.168.100.4">
        <button onclick="executeCommand()">Run</button>
        <div id="command-output"></div>
    </div>
    <script src="/static/js/script.js"></script>
</body>
</html>
